name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shadowtrix
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: shadowtrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowtrix -d shadowtrix"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shadowtrix:ci_only_password@localhost:5432/shadowtrix?schema=public
      APP_URL: http://localhost:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations to a clean database
        run: npm run db:deploy
      - name: Seed reference data
        run: npm run db:seed
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (unit + database integrity)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end, responsive and accessibility tests
        run: npm run test:e2e
      - name: Dependency audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high
