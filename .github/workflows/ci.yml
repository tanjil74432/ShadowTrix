name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the workflow token (the repository is public): CI only reads the code.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shadowtrix
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: shadowtrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowtrix -d shadowtrix"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Real SMTP sink: the auth end-to-end tests read the emails the app actually sends (verification, reset).
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://shadowtrix:ci_only_password@localhost:5432/shadowtrix?schema=public
      APP_URL: http://localhost:3010
      # CI-only value protecting nothing (throwaway database, no real data). Real secrets are never committed.
      AUTH_SECRET: ci-only-auth-signing-key-0123456789abcdefghijklmnop
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations to a clean database
        run: npm run db:deploy
      - name: Verify migrations match the Prisma schema (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed reference data
        run: npm run db:seed
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (unit, security, authorization and database integrity)
        run: npm test
      - name: Build
        run: npm run build
      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/api/v1/info > /dev/null && exit 0
            sleep 2
          done
          echo "Mailpit did not become ready" && exit 1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end, authentication, responsive and accessibility tests
        run: npm run test:e2e
      - name: Dependency audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high
